<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
<meta charset="UTF-8">
<title>OG Image Generator</title>
<link href="https://api.fontshare.com/v2/css?f[]=neue-montreal@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; width: 1200px; height: 630px; overflow: hidden; }
  .og-card {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    font-family: 'Neue Montreal', -apple-system, sans-serif;
    font-weight: 400;
    color: #f0f0f0;
  }
  /* Hero g2 hues filling the full frame — warm (yellow/red/pink) across the top
     flowing into blue across the bottom, mirroring the live hero + favicon.
     Wide ~64% stops + a warm→blue base so no dark areas show; full-bleed inset
     so blur(60px) never reveals an edge. */
  .mesh {
    position: absolute;
    inset: -12%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 100% 56% at 42% 2%, rgba(255, 214, 0, 0.90), transparent 62%),
      radial-gradient(ellipse 112% 52% at 40% 30%, rgba(255, 30, 58, 0.88), transparent 60%),
      radial-gradient(ellipse 112% 52% at 60% 54%, rgba(255, 48, 176, 0.82), transparent 60%),
      radial-gradient(ellipse 132% 64% at 46% 84%, rgba(22, 120, 255, 0.90), transparent 66%),
      linear-gradient(180deg, #3a0f28, #0f1850);
    filter: blur(60px);
  }
  .content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 84px;
    font-weight: 400;
    line-height: 1.16;
    letter-spacing: -0.03em;
    color: #ffffff;
  }
  h1 .next {
    color: rgba(240, 240, 240, 0.5);
  }
</style>
</head>
<body>
  <div class="og-card" id="card">
    <div class="mesh"></div>
    <div class="content">
      <h1>AI products people can trust.<br><span class="next">I build what I design.</span></h1>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image Generator</title>
<link href="https://api.fontshare.com/v2/css?f[]=neue-montreal@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; width: 1200px; height: 630px; overflow: hidden; }
  .og-card {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    font-family: 'Neue Montreal', -apple-system, sans-serif;
    font-weight: 400;
    color: #f0f0f0;
  }
  /* Hero mesh hues filling the full frame — no black anywhere. Deep-violet
     base under four corner pools (wide 65% stops so they blend across the
     center), full-bleed inset so blur(60px) never reveals an edge. */
  .mesh {
    position: absolute;
    inset: -12%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse at 22% 22%, rgba(100, 70, 220, 0.7), transparent 65%),
      radial-gradient(ellipse at 80% 24%, rgba(140, 90, 230, 0.55), transparent 65%),
      radial-gradient(ellipse at 78% 80%, rgba(255, 120, 110, 0.6), transparent 65%),
      radial-gradient(ellipse at 24% 84%, rgba(255, 150, 120, 0.45), transparent 65%),
      radial-gradient(ellipse at 50% 52%, rgba(120, 80, 225, 0.35), transparent 60%),
      linear-gradient(135deg, #1c1340, #2a1430);
    filter: blur(60px);
  }
  .content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 84px;
    font-weight: 400;
    line-height: 1.16;
    letter-spacing: -0.03em;
    color: #ffffff;
  }
  h1 .next {
    color: rgba(240, 240, 240, 0.5);
  }
</style>
</head>
<body>
  <div class="og-card" id="card">
    <div class="mesh"></div>
    <div class="content">
      <h1>AI-first product designer.<br><span class="next">Building what&rsquo;s next.</span></h1>
    </div>
  </div>
</body>
</html>

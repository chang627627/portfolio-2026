<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
<meta charset="UTF-8">
<title>OG Image Generator</title>
<style>
  @font-face { font-family: 'Neue Montreal'; src: url('fonts/NeueMontreal-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Neue Montreal'; src: url('fonts/NeueMontreal-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; }
  html, body { margin: 0; padding: 0; background: #090a0e; width: 1200px; height: 630px; overflow: hidden; }
  .og-card {
    width: 1200px;
    height: 630px;
    background: #090a0e;
    position: relative;
    overflow: hidden;
    font-family: 'Neue Montreal', -apple-system, sans-serif;
    font-weight: 400;
    color: #f0f0f0;
  }
  /* THE SHARE CARD IS THE SUNRISE (2026-10-12, per user, with a capture of the LinkedIn preview still in the purple
     gradient: "change my portfolio linkedin cover"): the Home hero's own painted sky (dawn-sky.js, scene sunrise),
     one still frame, the sun and hills along the bottom. The sky's box runs taller than the card so the hero's fade
     into the page's black falls below the card's edge. */
  .sky { position: absolute; left: 0; top: 0; width: 1200px; height: 735px; z-index: 0; }
  .content {
    position: absolute;
    inset: 0 0 110px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 86px;
    font-weight: 400;
    line-height: 1.12;
    letter-spacing: -0.04em;
    color: #ffffff;
    text-shadow: 0 0 28px rgba(255, 255, 255, 0.22);
  }
  /* line 2 is the role, in the site's one italic, as on the hero */
  h1 .next { font-style: italic; }
</style>
</head>
<body>
  <div class="og-card" id="card">
    <div class="sky" id="sky"></div>
    <div class="content">
      <h1>I'm Chang Mou.<br><span class="next">AI-first product designer.</span></h1>
    </div>
  </div>
  <script src="dawn-sky.js?v=6"></script>
  <script>
    // one still frame of the hero's sunrise; data-ready is set once it is painted and the fonts are in
    document.fonts.ready.then(() => {
      window.DawnSky.mount(document.getElementById('sky'), {
        scene: 'sunrise', time: 6, pointer: [0, 0], scroll: 0, horizon: 0.66, scale: 1, fade: 0,
        onDrawn: () => { document.documentElement.dataset.ready = '1'; },
        onFail: () => { document.documentElement.dataset.ready = 'failed'; }
      });
    });
  </script>
</body>
</html>

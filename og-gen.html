<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG Image Generator</title>
<link href="https://api.fontshare.com/v2/css?f[]=neue-montreal@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0a0a0a; width: 1200px; height: 630px; overflow: hidden; }
  .og-card {
    width: 1200px;
    height: 630px;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    font-family: 'Neue Montreal', -apple-system, sans-serif;
    font-weight: 400;
    color: #f0f0f0;
  }
  /* Hero g2 hues filling the full frame — warm (yellow/red/pink) across the top
     flowing into blue across the bottom, mirroring the live hero + favicon.
     Wide ~64% stops + a warm→blue base so no dark areas show; full-bleed inset
     so blur(60px) never reveals an edge. */
  .mesh {
    position: absolute;
    inset: -12%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse at 24% 18%, rgba(255, 205, 40, 0.60), transparent 64%),
      radial-gradient(ellipse at 80% 20%, rgba(255, 70, 95, 0.58), transparent 64%),
      radial-gradient(ellipse at 52% 42%, rgba(255, 60, 176, 0.50), transparent 62%),
      radial-gradient(ellipse at 20% 84%, rgba(34, 112, 255, 0.66), transparent 64%),
      radial-gradient(ellipse at 82% 82%, rgba(28, 96, 236, 0.62), transparent 64%),
      linear-gradient(165deg, #3a163c, #142a72);
    filter: blur(60px);
  }
  .content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-size: 84px;
    font-weight: 400;
    line-height: 1.16;
    letter-spacing: -0.03em;
    color: #ffffff;
  }
  h1 .next {
    color: rgba(240, 240, 240, 0.5);
  }
</style>
</head>
<body>
  <div class="og-card" id="card">
    <div class="mesh"></div>
    <div class="content">
      <h1>AI-first product designer.<br><span class="next">Building what&rsquo;s next.</span></h1>
    </div>
  </div>
</body>
</html>

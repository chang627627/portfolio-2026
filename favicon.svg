<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The painted dawn (2026-10-10), as the hero: night blue overhead, the gold breaking at the horizon, the sea below -->
  <defs>
    <clipPath id="c"><circle cx="16" cy="16" r="16"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3584"/>
      <stop offset="0.45" stop-color="#34449a"/>
      <stop offset="0.72" stop-color="#9a6390"/>
      <stop offset="0.9" stop-color="#e98f6c"/>
      <stop offset="1" stop-color="#ffc277"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4f72"/>
      <stop offset="0.35" stop-color="#433568"/>
      <stop offset="1" stop-color="#1a2154"/>
    </linearGradient>
    <radialGradient id="sun" cx="16" cy="21" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="0.35" stop-color="#ffc277" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffc277" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="32" height="21" fill="url(#sky)"/>
    <rect y="21" width="32" height="11" fill="url(#sea)"/>
    <rect width="32" height="21" fill="url(#sun)"/>
  </g>
</svg>

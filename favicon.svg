<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The rising sun over the hills (2026-10-10, with the Hills hero, his pick of three): the sun cut half and half by
       the horizon, behind a far and a near rolling hill; drawn crisp so it reads at 16px. In the sunrise's colours since
       2026-10-11 (the hero became the sunrise): a clear cobalt sky, a peach-gold horizon, blue silhouette hills -->
  <defs>
    <clipPath id="c"><circle cx="16" cy="16" r="16"/></clipPath>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="17">
      <stop offset="0" stop-color="#11358a"/>
      <stop offset="0.45" stop-color="#2f62ad"/>
      <stop offset="0.72" stop-color="#7f95c4"/>
      <stop offset="0.86" stop-color="#e9a877"/>
      <stop offset="1" stop-color="#f39a5c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbef"/>
      <stop offset="1" stop-color="#ffd98c"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a68a6"/>
      <stop offset="1" stop-color="#34437e"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b5c"/>
      <stop offset="1" stop-color="#111a3e"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="32" height="32" fill="url(#sky)"/>
    <path d="M9.5 16a6.5 6.5 0 0 1 13 0z" fill="url(#sun)"/>
    <path d="M0 16.6C6 14.4 10 15.4 16 16.2S26 15 32 16.4V32H0z" fill="url(#far)"/>
    <path d="M0 20.5C7 16.8 15 17.6 21 20.2S29 22.6 32 21.4V32H0z" fill="url(#near)"/>
  </g>
</svg>

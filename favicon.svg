<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The rising sun over the hills (2026-10-10, with the Hills hero, his pick of three): the sun cut half and half by
       the horizon, behind a far and a near rolling hill, in the hero's colours; drawn crisp so it reads at 16px -->
  <defs>
    <clipPath id="c"><circle cx="16" cy="16" r="16"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3584"/>
      <stop offset="0.6" stop-color="#4a4a9c"/>
      <stop offset="1" stop-color="#d47e86"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset="1" stop-color="#ffb066"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4a86"/>
      <stop offset="1" stop-color="#2c2f63"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2550"/>
      <stop offset="1" stop-color="#121735"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="32" height="32" fill="url(#sky)"/>
    <path d="M9.5 16a6.5 6.5 0 0 1 13 0z" fill="url(#sun)"/>
    <path d="M0 16.6C6 14.4 10 15.4 16 16.2S26 15 32 16.4V32H0z" fill="url(#far)"/>
    <path d="M0 20.5C7 16.8 15 17.6 21 20.2S29 22.6 32 21.4V32H0z" fill="url(#near)"/>
  </g>
</svg>

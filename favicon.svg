<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The rising sun (2026-10-10, his pick of four): a half sun on the horizon of the painted dawn, its light in three
       strokes on the sea, in the hero's colours; drawn crisp so it reads at 16px -->
  <defs>
    <clipPath id="c"><circle cx="16" cy="16" r="16"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3584"/>
      <stop offset="0.6" stop-color="#4a4a9c"/>
      <stop offset="1" stop-color="#d47e86"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset="1" stop-color="#ffb066"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3170"/>
      <stop offset="1" stop-color="#151c4a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="32" height="20.5" fill="url(#sky)"/>
    <rect y="20.5" width="32" height="11.5" fill="url(#sea)"/>
    <path d="M9.5 20.5a6.5 6.5 0 0 1 13 0z" fill="url(#sun)"/>
    <rect x="9" y="22.6" width="14" height="1.3" rx="0.65" fill="#ffc277" opacity="0.85"/>
    <rect x="11.5" y="25.2" width="9" height="1.1" rx="0.55" fill="#ffc277" opacity="0.55"/>
    <rect x="13.5" y="27.6" width="5" height="1" rx="0.5" fill="#ffc277" opacity="0.35"/>
  </g>
</svg>
